	<h1 id="sectionHeading">40th reunion school visit</h1>
	<script type="text/javascript" src="js/mootools.js"></script>

	<div class="blockCenter center">
	
		<a href="pictures/large/007579.jpg" rel="lightbox[classof763]" title="Head House: Just as it was... Head House without the Virginia Creeper remains much as it was on the outside, but has been reconfigured on the inside.">
		<img src="pictures/small/007579.jpg" alt="Head House" height="105"></a>
		<a href="pictures/large/007578.jpg" rel="lightbox[classof763]" title="New Front Entance detailing: Front matches rest of building... more detailing on the schools new entrance. Beautiful Work!">
		<img src="pictures/small/007578.jpg" alt="New Front Entance detailing" height="105"></a>
		<a href="pictures/large/007577.jpg" rel="lightbox[classof763]" title="New Front Entance: The new entrance is just to the right, when facing Head House. Architectural Listed status meant bricks had to be sourced in Germany, brick pointing by specialised masons.">
		<img src="pictures/small/007577.jpg" alt="New Front Entance" height="105"></a>
		<a href="pictures/large/007576.jpg" rel="lightbox[classof763]" title="Head House Main Hall: Shown from opposite side... This looks more like it... the head masters office is no longer on this level, but upstairs. Head hall is used mostly for administrative work.">
		<img src="pictures/small/007576.jpg" alt="Head House Main Hall" height="105"></a>
		<a href="pictures/large/007575.jpg" rel="lightbox[classof763]" title="Head House Main Hall: Just as I remember it... The main hall of head house is now a secondary entrance to the school. The tile work and other architectural details need to be preserved. The entire head House block is a listed building.">
		<img src="pictures/small/007575.jpg" alt="Head House Main Hall" height="105"></a>
		<a href="pictures/large/007574.jpg" rel="lightbox[classof763]" title="Prep School in the distance from Head House: The old Prep school (Prospect House) was sold a number of years ago and new school built in its place, closer to the main school.  Also at that time the Lisburn Quaker Meeting sold its premises in Lisburn centre and subsequently made its home at the new prep school. So practical!">
		<img src="pictures/small/007574.jpg" alt="Prep School in the distance from Head House" height="105"></a>
		<a href="pictures/large/007573.jpg" rel="lightbox[classof763]" title="A Rare Editon of the King James Bible: Tim Smith leafs through a rare first edition of the King James 1611 Bible. This bible was on display in Lisburn Library in 2011 during its 400th anniversary. The bible was given to the school many many years ago. Looking on are Julie Smith, Neville Jones and Lorraine (McMurray).">
		<img src="pictures/small/007573.jpg" alt="A Rare Editon of the King James Bible" height="105"></a>
		<a href="pictures/large/007572.jpg" rel="lightbox[classof763]" title="Archivists: Ancient Texts... Mr Chapman shows Paul Roberts a very old book. Tim Smith in foreground">
		<img src="pictures/small/007572.jpg" alt="Archivists" height="105"></a>
		<a href="pictures/large/007571.jpg" rel="lightbox[classof763]" title="Archivists: Mr Chapman opened the archive room where we viewed various displays he had arranged for us. Eager archivists here are Stephen Moore (school Head), Jenny Wilson (Robertson), Tim Smith and Robert Beatty.">
		<img src="pictures/small/007571.jpg" alt="Archivists" height="105"></a>
		<a href="pictures/large/007570.jpg" rel="lightbox[classof763]" title="Toward the playing fields, two new astro turf pitches: The school has just opened two new water based astro turf pitches. Antrim Senior division Mens team rent the pitches for their practices.">
		<img src="pictures/small/007570.jpg" alt="Toward the playing fields, two new astro turf pitches" height="105"></a>
		<a href="pictures/large/007569.jpg" rel="lightbox[classof763]" title="Cafeteria: Taken from the rear, this photo reminds us of thick and thin skinned custard, tapioca pudding and wonderful culinary delights from the kitchen.">
		<img src="pictures/small/007569.jpg" alt="Cafeteria" height="105"></a>
		<a href="pictures/large/007568.jpg" rel="lightbox[classof763]" title="Jenny Bo in the gym: Should I?... Shortly after this photo Jenny climbed one of the ropes and swung across the gym to the other side.">
		<img src="pictures/small/007568.jpg" alt="Jenny Bo in the gym" height="105"></a>
		<a href="pictures/large/007567.jpg" rel="lightbox[classof763]" title="The Gym: Paul Roberts taking it all in.">
		<img src="pictures/small/007567.jpg" alt="The Gym" height="105"></a>
		<a href="pictures/large/007566.jpg" rel="lightbox[classof763]" title="Chatting in Assembly: Ivor, Stephen, Julie and Maureen chat in Assembly">
		<img src="pictures/small/007566.jpg" alt="Chatting in Assembly" height="105"></a>
		<a href="pictures/large/007565.jpg" rel="lightbox[classof763]" title="Podium: Poised to speak">
		<img src="pictures/small/007565.jpg" alt="Podium" height="105"></a>
		<a href="pictures/large/007564.jpg" rel="lightbox[classof763]" title="Assembly: Assembly, standing the test of time.">
		<img src="pictures/small/007564.jpg" alt="Assembly" height="105"></a>
		<a href="pictures/large/007563.jpg" rel="lightbox[classof763]" title="Where old meets new: Stephen Moore, current Head of Friends Schools explains how the old school and new buildings meet up in a busy 2nd floor hall and corridors">
		<img src="pictures/small/007563.jpg" alt="Where old meets new" height="105"></a>
		<a href="pictures/large/007562.jpg" rel="lightbox[classof763]" title="Sharing a laugh: Sharing a laugh while touring the newly renovated upstairs of the old building.">
		<img src="pictures/small/007562.jpg" alt="Sharing a laugh" height="105"></a>
		<a href="pictures/large/007561.jpg" rel="lightbox[classof763]" title="Red Maths Class: Red Sums up... apparently the bright red paint will keep students cognitive abilities Sharp.">
		<img src="pictures/small/007561.jpg" alt="Red Maths Class" height="105"></a>
		<a href="pictures/large/007560.jpg" rel="lightbox[classof763]" title="Music Notice Board: Busy Schedules... plenty of concerts for the choirs, various bands and orchestras to practice for;">
		<img src="pictures/small/007560.jpg" alt="Music Notice Board" height="105"></a>
		<a href="pictures/large/007559.jpg" rel="lightbox[classof763]" title="Composition and Jamming room: Musical Instruments... this smaller, sound proofed room is for music composition and rehearsals.">
		<img src="pictures/small/007559.jpg" alt="Composition and Jamming room" height="105"></a>
		<a href="pictures/large/007558.jpg" rel="lightbox[classof763]" title="New Math and Music Building: Bright, light... Jenny Boyd Conducting with Diane Drayne">
		<img src="pictures/small/007558.jpg" alt="New Math and Music Building" height="105"></a>
		<a href="pictures/large/007513.jpg" rel="lightbox[classof763]" title="Rare bird sightings!: Maureen Campbell, 5th from left and Palmela Davis, 8th from left.  Also Arthur Chapman (7th from right) and Stephen Moore (Principal) (4th from right).">
		<img src="pictures/small/007513.jpg" alt="Rare bird sightings!" height="105"></a>
		<a href="pictures/large/007508.jpg" rel="lightbox[classof763]" title="Landscaped area outside the new building that replaced Harding House: Robert Beatty (second left) came to the school tour, although he didn't attend the dinner later. Recently retired and loving it!">
		<img src="pictures/small/007508.jpg" alt="Landscaped area outside the new building that replaced Harding House" height="105"></a>
		<a href="pictures/large/007507.jpg" rel="lightbox[classof763]" title="Like a bunch of unruly schoolchildren!: There was so much chatter we often found ourselves straggling behind the tour leader (the Principal, Stephen Moore).">
		<img src="pictures/small/007507.jpg" alt="Like a bunch of unruly schoolchildren!" height="105"></a>
		<a href="pictures/large/007506.jpg" rel="lightbox[classof763]" title="1st XV main rugby pitch: and glimpse of gymnasium and sports facilities in purpose-built building close to sports pitches.">
		<img src="pictures/small/007506.jpg" alt="1st XV main rugby pitch" height="105"></a>
		<a href="pictures/large/007504.jpg" rel="lightbox[classof763]" title="The new building replacing Harding House: now home to state of the art music rooms, inclusing a MacSuite for mixing music, a recording studio, several music classrooms with flexible partitioning.  We also saw the maths classroom, the new standard in classrooms, with comfortable moulded chairs, desks, and a touch screen blackboard, like a giant ipad.">
		<img src="pictures/small/007504.jpg" alt="The new building replacing Harding House" height="105"></a>
		<a href="pictures/large/007503.jpg" rel="lightbox[classof763]" title="The path up to the rear of the dining hall: Note the absence of the Victorian swimming pool! Long since demolished.">
		<img src="pictures/small/007503.jpg" alt="The path up to the rear of the dining hall" height="105"></a>
		<a href="pictures/large/007502.jpg" rel="lightbox[classof763]" title="The rear of what was the boarding department: it now has ground floor reception, first floor Principal's office (formerly McCleary home) and second floor huge room for meetings.">
		<img src="pictures/small/007502.jpg" alt="The rear of what was the boarding department" height="105"></a>
		<a href="pictures/large/007501.jpg" rel="lightbox[classof763]" title="Sports grounds: view over sports grounds from 2nd floor original house.">
		<img src="pictures/small/007501.jpg" alt="Sports grounds" height="105"></a>
		<a href="pictures/large/007500.jpg" rel="lightbox[classof763]" title="View over the front entrance: towards the tennis courts">
		<img src="pictures/small/007500.jpg" alt="View over the front entrance" height="105"></a>
		<a href="pictures/large/007499.jpg" rel="lightbox[classof763]" title="The long meeting room: formerly dormitory accommodation.">
		<img src="pictures/small/007499.jpg" alt="The long meeting room" height="105"></a>
		<a href="pictures/large/007498.jpg" rel="lightbox[classof763]" title="The long meeting room: formerly dormitory accommodation.">
		<img src="pictures/small/007498.jpg" alt="The long meeting room" height="105"></a>
		<a href="pictures/large/007497.jpg" rel="lightbox[classof763]" title="The long meeting room: with Julie Smyth &amp; Simon Gilbert">
		<img src="pictures/small/007497.jpg" alt="The long meeting room" height="105"></a>
		<a href="pictures/large/007496.jpg" rel="lightbox[classof763]" title="Reminiscing in the assembly hall: the place where all of our concerts, school plays and morning assemblies were held.  Principal Stephen Moore is standing on the stage.">
		<img src="pictures/small/007496.jpg" alt="Reminiscing in the assembly hall" height="105"></a>
		<a href="pictures/large/007495.jpg" rel="lightbox[classof763]" title="A King James bible dated 1610, presented to school in the 1800s, beautiful scripts and delicate page-turning with gloves: in the foreground is an LP; the limited edition 1976 Friends School Choir featuring, inter alia, Neville Jones and Maggie Thompson.">
		<img src="pictures/small/007495.jpg" alt="A King James bible dated 1610, presented to school in the 1800s, beautiful scripts and delicate page-turning with gloves" height="105"></a>
		<a href="pictures/large/007494.jpg" rel="lightbox[classof763]" title="Simon and Fiona Gilbert: outside the original entrance to school. The new entrance is round to the right.">
		<img src="pictures/small/007494.jpg" alt="Simon and Fiona Gilbert" height="105"></a>
